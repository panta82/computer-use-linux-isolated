name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --lib
      - run: cargo build --locked --bin computer-use-linux-isolated
      - run: target/debug/computer-use-linux-isolated --help
      - run: python3 -m py_compile desktop/*.py
      - run: python3 scripts/test-desktop-manager.py
      - run: bash -n install.sh
      - name: Shared-input builds must be rejected
        run: |
          if cargo check --no-default-features 2> /tmp/rejected.log; then exit 1; fi
          grep -q 'shared desktop builds are forbidden' /tmp/rejected.log
